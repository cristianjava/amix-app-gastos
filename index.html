<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#13241c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Amix">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Amix Gastos y Deudas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    html{-webkit-text-size-adjust:100%}
    :root{padding-top:env(safe-area-inset-top,0px);background:var(--bar)}
    body{margin:0}
    [hidden]{display:none!important}
    /* Layout: estilo Amix — banda superior verde oscuro con la marca entre esquinas doradas, tarjetas blancas sobre fondo verde grisáceo, pestañas abajo */
    :root{
      --bar:#13241c; --bar-fg:#ffffff; --bar-sub:#b7c4bd; --gold:#e3a04b;
      --bg:#e9eeec; --surface:#ffffff; --fg:#15241d; --muted:#5b6b63; --line:#d5dfda;
      --accent:#2e6249; --accent-ink:#ffffff; --sel-bg:#d3e7da; --sel-fg:#1d4a33;
      --deb:#2e6b4a; --deb-soft:#dcede3; --cre:#a85f1c; --cre-soft:#f7e8d6;
      --danger:#a8474f; --danger-bg:#f8e6e7; --danger-line:#e6bcc0;
      --okc:#3a7655; --ok-bg:#e3f0e8; --ok-line:#bcd9c7;
      --scrim:rgba(10,20,15,.45);
      --display:"Manrope", "Segoe UI", system-ui, sans-serif;
      --brand:"Unbounded", "Arial Black", system-ui, sans-serif;
      --body:"Manrope", "Segoe UI", system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
      --bar:#0b1511; --bar-fg:#ffffff; --bar-sub:#9fb0a7; --gold:#e3a04b;
      --bg:#0f1a15; --surface:#17241e; --fg:#e6eeea; --muted:#9bb0a5; --line:#2a3a32;
      --accent:#5fae86; --accent-ink:#0f1a15; --sel-bg:#1f3a2c; --sel-fg:#bfe3cd;
      --deb:#7cc9a0; --deb-soft:#1b3328; --cre:#eba868; --cre-soft:#3a2817;
      --danger:#e3a0a6; --danger-bg:#3a2023; --danger-line:#5c3337;
      --okc:#93d3ae; --ok-bg:#1c3328; --ok-line:#2f5040; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
    :root[data-theme="dark"]{
      --bar:#0b1511; --bar-fg:#ffffff; --bar-sub:#9fb0a7; --gold:#e3a04b;
      --bg:#0f1a15; --surface:#17241e; --fg:#e6eeea; --muted:#9bb0a5; --line:#2a3a32;
      --accent:#5fae86; --accent-ink:#0f1a15; --sel-bg:#1f3a2c; --sel-fg:#bfe3cd;
      --deb:#7cc9a0; --deb-soft:#1b3328; --cre:#eba868; --cre-soft:#3a2817;
      --danger:#e3a0a6; --danger-bg:#3a2023; --danger-line:#5c3337;
      --okc:#93d3ae; --ok-bg:#1c3328; --ok-line:#2f5040; --scrim:rgba(0,0,0,.6); color-scheme:dark}
    *{box-sizing:border-box}
    body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;min-height:100vh}
    .wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(96px + env(safe-area-inset-bottom,0px))}
    .topbar{background:var(--bar);color:var(--bar-fg);text-align:center;padding-block:18px 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-shadow:0 2px 10px rgba(0,0,0,.18)}
    .brand{position:relative;display:inline-block;font:700 2rem/1 var(--brand);letter-spacing:.01em;padding:8px 20px 6px;margin:0}
    .brand::before,.brand::after{content:"";position:absolute;width:14px;height:14px;border:2.5px solid var(--gold)}
    .brand::before{left:0;top:0;border-right:0;border-bottom:0}
    .brand::after{right:0;bottom:-4px;border-left:0;border-top:0}
    .topbar p{margin:8px 0 0;color:var(--bar-sub);font-size:.92rem;font-weight:500}
    h2{font-family:var(--display);font-weight:800;font-size:1.2rem;margin:0}
    .today{color:var(--muted);font-size:.9rem}
    .num{font-variant-numeric:tabular-nums}
    .panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:16px}
    .stack{display:grid;gap:16px}
    label,.lbl{font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
    .field{display:grid;gap:6px}
    .seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
    .seg button{border:0;background:transparent;color:var(--muted);font:600 1rem var(--body);padding:10px;border-radius:9px;cursor:pointer}
    .seg button[aria-pressed="true"][data-t="debito"]{background:var(--deb-soft);color:var(--deb)}
    .seg button[aria-pressed="true"][data-t="credito"]{background:var(--cre-soft);color:var(--cre)}
    select,input{width:100%;font:500 1rem var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
    .money{position:relative}
    .money span{position:absolute;left:14px;top:50%;transform:translateY(-50%);font:700 1.6rem var(--display);color:var(--muted)}
    .money input{font:700 1.9rem var(--display);padding-left:38px;font-variant-numeric:tabular-nums}
    :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
    .btn{border:0;border-radius:10px;padding:14px 18px;font:700 1rem var(--body);cursor:pointer;background:var(--accent);color:var(--accent-ink)}
    .btn:disabled{opacity:.45;cursor:not-allowed}
    .btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
    .btn.small{padding:8px 12px;font-size:.9rem}
    .datebox{display:flex;justify-content:space-between;gap:8px;font-size:.92rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:12px}
    .datebox strong{color:var(--fg);font-weight:600}
    .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.95rem;z-index:30}
    .cards{display:grid;gap:8px}
    .card-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
    .card-row .name{flex:1 1 55%;min-width:0;overflow-wrap:break-word;font-weight:600}
    .card-row .acts{display:flex;align-items:center;gap:6px;margin-left:auto}
    .card-row.def{border-color:var(--accent)}
    .star{border:1px solid var(--line);background:transparent;color:var(--muted);font:600 .78rem var(--body);padding:5px 9px;border-radius:999px;cursor:pointer;white-space:nowrap}
    .star[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
    .validando .item{cursor:pointer;border-radius:10px;padding-inline:10px;transition:background .15s}
    .item.ok{background:var(--sel-bg);color:var(--sel-fg)}
    .item.ok .t{color:var(--sel-fg)}
    .vbar{display:grid;gap:8px}
    .vbar .notice{margin:0}
    .chip{font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
    .chip.debito{background:var(--deb-soft);color:var(--deb)} .chip.credito{background:var(--cre-soft);color:var(--cre)}
    .x{border:0;background:transparent;color:var(--muted);font-size:.9rem;cursor:pointer;padding:6px 8px;border-radius:8px}
    .x.confirm{color:var(--danger);font-weight:600}
    .addcard{display:grid;grid-template-columns:1fr auto;gap:8px}
    .addcard .seg{grid-column:1/-1}
    .month{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .month h2{text-transform:capitalize;text-align:center;flex:1}
    .month button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:1.2rem;cursor:pointer}
    .list{display:grid}
    .day{font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:14px 2px 6px}
    .item{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
    .item .c{font-weight:700;min-width:0;overflow-wrap:anywhere}
    .item .t{font-size:.85rem;color:var(--muted);grid-column:1}
    .item .m{font-weight:600;grid-row:1;grid-column:2;text-align:right}
    .item .acts{grid-column:1/-1;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;margin-top:6px}
    .act{font:700 .78rem var(--body);padding:6px 9px;white-space:nowrap;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
    .act.del{background:var(--danger-bg);border-color:var(--danger-line);color:var(--danger)}
    .act.pay{background:var(--ok-bg);border-color:var(--ok-line);color:var(--okc)}
    .item .ini{font-size:.8rem;color:var(--muted);grid-column:2;text-align:right}
    .chip.paid{background:var(--ok-bg);color:var(--okc)}
    dialog.modal{border:0;padding:0;border-radius:16px;background:var(--surface);color:var(--fg);width:min(92vw,380px);box-shadow:0 18px 50px rgba(0,0,0,.3)}
    dialog.modal::backdrop{background:var(--scrim)}
    .modal form{display:grid;gap:14px;padding:22px 20px 18px}
    .modal h3{margin:0;font:800 1.1rem var(--display);text-wrap:balance}
    .modal .msg{margin:0;color:var(--muted)}
    .modal .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .modal .err{margin:0;color:var(--danger);font-size:.85rem}
    .hist{margin:0;padding:0;list-style:none;display:grid;gap:0;counter-reset:h}
    .hist li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);counter-increment:h}
    .hist li span:first-child::before{content:counter(h) ". ";color:var(--muted);font-weight:700}
    .hist li span:last-child{font-weight:700;white-space:nowrap}
    .hist-total{display:flex;justify-content:space-between;gap:12px;font-weight:800;padding:12px 14px;border-radius:10px;background:var(--ok-bg);color:var(--okc)}
    .subs{display:grid;gap:6px;font-size:.92rem}
    .subs div{display:flex;justify-content:space-between;gap:12px}
    .subs span:first-child{color:var(--muted);min-width:0;overflow-wrap:anywhere}
    .total{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:16px 18px;border-radius:14px}
    .total.debito{background:var(--deb-soft);color:var(--deb)} .total.credito{background:var(--cre-soft);color:var(--cre)}
    .total .v{font:700 1.7rem var(--display)}
    .backup{display:flex;flex-wrap:wrap;gap:8px}
    .backup label.btn{text-transform:none;letter-spacing:0;font-size:.9rem;color:var(--accent)}
    .seg button[aria-pressed="true"][data-t="meDeben"]{background:var(--deb-soft);color:var(--deb)}
    .seg button[aria-pressed="true"][data-t="debo"]{background:var(--cre-soft);color:var(--cre)}
    .total.meDeben{background:var(--deb-soft);color:var(--deb)} .total.debo{background:var(--cre-soft);color:var(--cre)}
    .empty{color:var(--muted);text-align:center;padding:28px 8px}
    .notice{font-size:.85rem;color:var(--muted);text-align:center}
    nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:20}
    nav button{border:0;background:transparent;color:var(--muted);font:600 .82rem var(--body);padding:8px 4px;display:grid;justify-items:center;gap:3px;cursor:pointer;border-radius:10px}
    nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    nav button[aria-current="page"]{color:var(--accent)}
    @media (prefers-reduced-motion:no-preference){.toast{animation:pop .2s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}}
  </style>
</head>
<body>

<header class="topbar"><h1 class="brand">Amix</h1><p>Amix Gastos y Deudas</p><span id="today" hidden></span></header>

<dialog class="modal" id="modal"><form method="dialog" id="modal-f"></form></dialog>

<div class="wrap">

  <!-- REGISTRAR -->
  <section id="v-reg" class="stack">
    <form class="panel" id="f-gasto" autocomplete="off">
      <div class="field"><span class="lbl">Tipo de tarjeta</span>
        <div class="seg" id="seg-reg"><button type="button" data-t="debito" aria-pressed="true">Débito</button><button type="button" data-t="credito" aria-pressed="false">Crédito</button></div>
      </div>
      <div class="field"><label for="sel-card">Tarjeta</label><select id="sel-card"></select></div>
      <div class="field"><label for="in-monto">Monto de la compra</label>
        <div class="money"><span>$</span><input id="in-monto" inputmode="numeric" placeholder="0" aria-describedby="hint"></div>
      </div>
      <div class="field"><label for="in-nota">Descripción</label><input id="in-nota" maxlength="60" required placeholder="Ej. mercado, gasolina"></div>
      <div class="datebox"><span>Fecha y hora</span><strong id="now" class="num"></strong></div>
      <button class="btn" id="b-save" type="submit">Guardar gasto</button>
      <p class="notice" id="hint" hidden></p>
    </form>
  </section>

  <!-- GASTOS DEL MES -->
  <section id="v-mes" class="stack" hidden>
    <div class="seg" id="seg-mes"><button type="button" data-t="debito" aria-pressed="true">Débito</button><button type="button" data-t="credito" aria-pressed="false">Crédito</button></div>
    <div class="field"><label for="sel-mes-card">Tarjeta</label><select id="sel-mes-card"></select></div>
    <div class="month"><button type="button" id="m-prev" aria-label="Mes anterior">‹</button><h2 id="m-label"></h2><button type="button" id="m-next" aria-label="Mes siguiente">›</button></div>
    <div class="panel">
      <div class="list" id="list"></div>
      <div class="subs num" id="subs"></div>
      <div class="total" id="total"><span>Total del mes</span><span class="v num" id="total-v"></span></div>
      <div class="vbar">
        <p class="notice" id="v-hint" hidden>Toca cada compra para marcarla como revisada.</p>
        <button type="button" class="btn" id="b-validar">Validar precios</button>
      </div>
    </div>
  </section>

  <!-- TARJETAS -->
  <section id="v-tar" class="stack" hidden>
    <form class="panel" id="f-card" autocomplete="off">
      <h2>Agregar tarjeta</h2>
      <div class="addcard">
        <div class="seg" id="seg-card"><button type="button" data-t="debito" aria-pressed="true">Débito</button><button type="button" data-t="credito" aria-pressed="false">Crédito</button></div>
        <input id="in-card" maxlength="40" placeholder="Ej. Bancolombia Visa 4417" aria-label="Nombre de la tarjeta">
        <button class="btn" type="submit">Agregar</button>
      </div>
    </form>
    <div class="panel"><h2>Mis tarjetas</h2><div class="cards" id="cards"></div></div>
    <div class="panel"><h2>Respaldo</h2>
      <p class="notice" id="store-note" style="text-align:left;margin:0"></p>
      <div class="backup">
        <button type="button" class="btn ghost small" id="b-csv">Exportar a Excel (CSV)</button>
        <button type="button" class="btn ghost small" id="b-json">Guardar respaldo</button>
        <label class="btn ghost small" for="in-import">Restaurar respaldo</label>
        <input type="file" id="in-import" accept=".json,application/json" hidden>
      </div>
    </div>
  </section>

  <!-- DEUDAS -->
  <section id="v-deu" class="stack" hidden>
    <div class="seg" id="seg-deu"><button type="button" data-t="meDeben" aria-pressed="true">Me deben</button><button type="button" data-t="debo" aria-pressed="false">Debo</button></div>
    <form class="panel" id="f-deuda" autocomplete="off">
      <div class="field"><label for="in-deu-monto" id="deu-lbl">Valor que me deben</label>
        <div class="money"><span>$</span><input id="in-deu-monto" inputmode="numeric" placeholder="0"></div>
      </div>
      <div class="field"><label for="in-deu-nota">Descripción</label><input id="in-deu-nota" maxlength="60" required placeholder="Ej. préstamo a Juan"></div>
      <div class="datebox"><span>Fecha</span><strong id="deu-now" class="num"></strong></div>
      <button class="btn" id="b-deu-save" type="submit" disabled>Guardar</button>
    </form>
    <div class="panel">
      <h2 id="deu-title">Me deben</h2>
      <div class="list" id="deu-list"></div>
      <div class="total meDeben" id="deu-total"><span></span><span class="v num" id="deu-total-v"></span></div>
    </div>
  </section>
</div>

<nav aria-label="Secciones">
  <button type="button" data-v="reg" aria-current="page"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Registrar</button>
  <button type="button" data-v="mes"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Gastos del mes</button>
  <button type="button" data-v="tar"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg>Tarjetas</button>
  <button type="button" data-v="deu"><svg viewBox="0 0 24 24"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg>Deudas</button>
</nav>

<script>
  (function(){
    const $=s=>document.querySelector(s);
    const fmt=new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0});
    const fDate=new Intl.DateTimeFormat("es-CO",{weekday:"long",day:"numeric",month:"short",year:"numeric"});
    const fFull=new Intl.DateTimeFormat("es-CO",{day:"numeric",month:"short",year:"numeric",hour:"numeric",minute:"2-digit"});
    const fTime=new Intl.DateTimeFormat("es-CO",{hour:"numeric",minute:"2-digit"});
    const fDay=new Intl.DateTimeFormat("es-CO",{weekday:"long",day:"numeric"});
    const fMonth=new Intl.DateTimeFormat("es-CO",{month:"long",year:"numeric"});
    const pad=n=>String(n).padStart(2,"0");
    const mkey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1);

    let state={cards:[],gastos:[],deudas:[],regTipo:"debito",mesTipo:"debito",mesCard:"",cardTipo:"debito",deuTipo:"meDeben",mes:new Date(),validando:false,validados:new Set()};
    let store=null; // {saveCards, addGasto, delGasto}

    /* ---- almacenamiento: db privada por persona; si no hay, este navegador ---- */
    const LS="amix-gastos-v1";
    function lsLoad(){try{const d=JSON.parse(localStorage.getItem(LS)||"{}");state.cards=d.cards||[];state.gastos=d.gastos||[];state.deudas=d.deudas||[];}catch(e){}}
    function lsSave(){try{localStorage.setItem(LS,JSON.stringify({cards:state.cards,gastos:state.gastos,deudas:state.deudas}));}catch(e){}}
    const localStore={
      async saveCards(){lsSave();},
      async addGasto(g){g.id="g"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);state.gastos.push(g);lsSave();render();},
      async delGasto(id){state.gastos=state.gastos.filter(g=>g.id!==id);lsSave();render();}
    };

    function initStore(){
      lsLoad();store=localStore;aplicarDefecto();
      try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
      $("#store-note").textContent="Tus datos se guardan solo en este dispositivo. Haz un respaldo de vez en cuando.";
      render();
    }

    /* ---- respaldo: exportar CSV / JSON e importar JSON ---- */
    function bajar(nombre,contenido,tipo){
      const blob=new Blob([contenido],{type:tipo});
      const file=new File([blob],nombre,{type:tipo});
      if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:nombre}).catch(()=>{});return;}
      const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nombre;document.body.appendChild(a);a.click();
      setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
    }
    const hoy=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());};
    function exportCSV(){
      const name=id=>(state.cards.find(c=>c.id===id)||{}).nombre;
      const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
      const rows=[["Fecha","Hora","Tipo","Tarjeta","Monto","Descripción"]];
      [...state.gastos].sort((a,b)=>a.fecha<b.fecha?-1:1).forEach(g=>{const d=new Date(g.fecha);
        rows.push([d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()),pad(d.getHours())+":"+pad(d.getMinutes()),g.tipo==="debito"?"Débito":"Crédito",name(g.cardId)||g.cardNombre||"",g.monto,g.nota||""]);});
      bajar("amix-gastos-"+hoy()+".csv","﻿"+rows.map(r=>r.map(q).join(";")).join("\r\n"),"text/csv");
    }
    function exportJSON(){bajar("amix-gastos-respaldo-"+hoy()+".json",JSON.stringify({app:"amix-gastos",version:2,cards:state.cards,gastos:state.gastos,deudas:state.deudas},null,1),"application/json");}
    function importJSON(file){
      const r=new FileReader();
      r.onload=()=>{try{
        const d=JSON.parse(r.result);if(!Array.isArray(d.cards)||!Array.isArray(d.gastos))throw 0;
        const ids=new Set(state.gastos.map(g=>g.id)),cids=new Set(state.cards.map(c=>c.id));
        const nc=d.cards.filter(c=>c&&c.id&&!cids.has(c.id)),ng=d.gastos.filter(g=>g&&g.id&&!ids.has(g.id)&&typeof g.monto==="number");
        const dids=new Set(state.deudas.map(x=>x.id));
        const nd=(Array.isArray(d.deudas)?d.deudas:[]).filter(x=>x&&x.id&&!dids.has(x.id)&&typeof x.monto==="number");
        state.cards=[...state.cards,...nc];state.gastos=[...state.gastos,...ng];state.deudas=[...state.deudas,...nd];lsSave();render();
        toast("Importado: "+nc.length+" tarjetas, "+ng.length+" gastos, "+nd.length+" deudas");
      }catch(e){toast("Ese archivo no es un respaldo de Amix Gastos");}};
      r.readAsText(file);
    }

    /* ---- utilidades UI ---- */
    function toast(t){document.querySelectorAll(".toast").forEach(x=>x.remove());const el=document.createElement("div");el.className="toast";el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),1800);}
    function bindSeg(id,key,cb){const seg=$(id);seg.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;state[key]=b.dataset.t;seg.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));cb&&cb();});}
    /* ---- ventana emergente ---- */
    function modal({title,msg,body,buttons}){
      return new Promise(res=>{
        const dlg=$("#modal"),f=$("#modal-f");f.replaceChildren();
        const h=document.createElement("h3");h.textContent=title;f.appendChild(h);
        if(msg){const p=document.createElement("p");p.className="msg";p.textContent=msg;f.appendChild(p);}
        if(body)f.appendChild(body);
        const row=document.createElement("div");row.className="row";
        buttons.forEach(b=>{const el=document.createElement("button");el.type="button";el.className="btn"+(b.ghost?" ghost":"");el.textContent=b.label;
          el.addEventListener("click",()=>{if(b.check&&!b.check())return;dlg.close();res(b.value);});row.appendChild(el);});
        if(buttons.length===1)row.style.gridTemplateColumns="1fr";
        f.appendChild(row);
        dlg.onclose=()=>res(undefined);dlg.oncancel=()=>res(undefined);
        dlg.showModal();
      });
    }
    const confirmar=t=>modal({title:t,buttons:[{label:"No",value:false,ghost:true},{label:"Sí",value:true}]});
    const abonado=x=>(x.abonos||[]).reduce((a,b)=>a+b.monto,0);
    const saldo=x=>Math.max(0,x.monto-abonado(x));
    function actBtn(txt,cls,fn){const b=document.createElement("button");b.type="button";b.className="act "+cls;b.textContent=txt;b.addEventListener("click",fn);return b;}

    function confirmBtn(btn,label,action){btn.addEventListener("click",()=>{if(btn.classList.contains("confirm")){action();return;}btn.classList.add("confirm");btn.textContent="¿Eliminar?";setTimeout(()=>{btn.classList.remove("confirm");btn.textContent=label;},3000);});}
    const parseMonto=v=>Number(String(v).replace(/\D/g,""))||0;

    /* ---- tarjeta por defecto ---- */
    const cardDef=()=>state.cards.find(c=>c.defecto);
    const defDeTipo=t=>{const d=cardDef();return d&&d.tipo===t?d.id:"";};
    function setSeg(id,val){document.querySelectorAll(id+" button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.t===val));}
    function aplicarDefecto(){
      const d=cardDef();if(!d)return;
      state.regTipo=d.tipo;state.mesTipo=d.tipo;state.mesCard=d.id;state.regCard=d.id;
      setSeg("#seg-reg",d.tipo);setSeg("#seg-mes",d.tipo);
    }

    /* ---- render ---- */
    function renderReg(){
      const sel=$("#sel-card"),prev=state.regCard||sel.value;state.regCard="";
      const cs=state.cards.filter(c=>c.tipo===state.regTipo);
      sel.replaceChildren();
      if(!cs.length){const o=new Option("No tienes tarjetas de "+(state.regTipo==="debito"?"débito":"crédito"),"");sel.add(o);sel.disabled=true;}
      else{sel.disabled=false;cs.forEach(c=>sel.add(new Option(c.nombre+(c.defecto?" (por defecto)":""),c.id)));
        if(cs.some(c=>c.id===prev))sel.value=prev;else if(defDeTipo(state.regTipo))sel.value=defDeTipo(state.regTipo);}
      const hint=$("#hint");
      hint.hidden=!!cs.length; hint.textContent="Agrega una tarjeta en la pestaña Tarjetas para empezar.";
      $("#b-save").disabled=!cs.length||!parseMonto($("#in-monto").value)||!$("#in-nota").value.trim();
    }
    function renderMes(){
      const key=mkey(state.mes), tipo=state.mesTipo;
      $("#m-label").textContent=fMonth.format(state.mes);
      $("#m-next").disabled=key>=mkey(new Date());
      const name=id=>(state.cards.find(c=>c.id===id)||{}).nombre;
      const tipoTxt=tipo==="debito"?"débito":"crédito";

      // filtro de tarjeta: si solo hay una de este tipo, queda seleccionada por defecto
      const sel=$("#sel-mes-card"),cs=state.cards.filter(c=>c.tipo===tipo);
      const prev=state.mesCard;sel.replaceChildren();
      if(cs.length!==1)sel.add(new Option(cs.length?"Todas las tarjetas "+tipoTxt:"No tienes tarjetas "+tipoTxt,""));
      cs.forEach(c=>sel.add(new Option(c.nombre+(c.defecto?" (por defecto)":""),c.id)));
      sel.value=cs.length===1?cs[0].id:(cs.some(c=>c.id===prev)?prev:"");
      sel.disabled=cs.length<2;
      const cardSel=sel.value;

      // más reciente primero
      const rows=state.gastos.filter(g=>g.tipo===tipo&&g.mes===key&&(!cardSel||g.cardId===cardSel)).sort((a,b)=>a.fecha<b.fecha?1:-1);
      const list=$("#list");list.replaceChildren();
      if(!rows.length){const p=document.createElement("p");p.className="empty";p.textContent=cardSel?"Sin gastos con esta tarjeta en este mes.":"Sin gastos con tarjeta "+tipoTxt+" en este mes.";list.appendChild(p);}
      let total=0;const byCard={};
      rows.forEach(g=>{
        const d=new Date(g.fecha);
        const it=document.createElement("div");it.className="item"+(state.validando&&state.validados.has(g.id)?" ok":"");
        if(state.validando){it.setAttribute("role","button");it.tabIndex=0;it.setAttribute("aria-pressed",state.validados.has(g.id));
          const tog=()=>{const on=!state.validados.has(g.id);on?state.validados.add(g.id):state.validados.delete(g.id);it.classList.toggle("ok",on);it.setAttribute("aria-pressed",on);};
          it.addEventListener("click",tog);it.addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();tog();}});}
        const c=document.createElement("div");c.className="c";c.textContent=g.nota||"Sin descripción";
        const m=document.createElement("div");m.className="m num";m.textContent=fmt.format(g.monto);
        const t=document.createElement("div");t.className="t num";{const dia=fDay.format(d);t.textContent=dia.charAt(0).toUpperCase()+dia.slice(1)+" · "+fTime.format(d);}
        const acts=document.createElement("div");acts.className="acts";
        acts.appendChild(actBtn("Eliminar","del",async()=>{
          if(!await confirmar("¿Desea eliminar este gasto?"))return;
          store.delGasto(g.id).then(()=>toast("Gasto eliminado")).catch(()=>toast("No se pudo eliminar"));
        }));
        if(state.validando)it.append(c,m,t);else it.append(c,m,t,acts);list.appendChild(it);
        total+=g.monto;const n=name(g.cardId)||g.cardNombre||"Tarjeta";byCard[n]=(byCard[n]||0)+g.monto;
      });
      const subs=$("#subs");subs.replaceChildren();
      const names=Object.keys(byCard);
      if(names.length>1)names.forEach(n=>{const r=document.createElement("div");const a=document.createElement("span");a.textContent=n;const b=document.createElement("span");b.textContent=fmt.format(byCard[n]);r.append(a,b);subs.appendChild(r);});
      subs.hidden=names.length<2;
      const tot=$("#total");tot.className="total "+tipo;
      tot.firstElementChild.textContent="Total "+(tipo==="debito"?"débito":"crédito")+" · "+rows.length+(rows.length===1?" compra":" compras");
      $("#total-v").textContent=fmt.format(total);
      list.classList.toggle("validando",state.validando);
      $("#b-validar").textContent=state.validando?"Finalizar validación":"Validar precios";
      $("#b-validar").classList.toggle("ghost",state.validando);
      $("#b-validar").hidden=!rows.length&&!state.validando;
      $("#v-hint").hidden=!state.validando;
    }
    function renderCards(){
      const box=$("#cards");box.replaceChildren();
      if(!state.cards.length){const p=document.createElement("p");p.className="empty";p.textContent="Aún no tienes tarjetas. Agrega la primera arriba.";box.appendChild(p);return;}
      [...state.cards].sort((a,b)=>a.tipo.localeCompare(b.tipo)||a.nombre.localeCompare(b.nombre)).forEach(c=>{
        const r=document.createElement("div");r.className="card-row"+(c.defecto?" def":"");
        const ch=document.createElement("span");ch.className="chip "+c.tipo;ch.textContent=c.tipo==="debito"?"Débito":"Crédito";
        const n=document.createElement("span");n.className="name";n.textContent=c.nombre;
        const x=actBtn("Quitar","del",async()=>{
          if(!await confirmar("¿Desea quitar la tarjeta "+c.nombre+"?"))return;
          state.cards=state.cards.filter(k=>k.id!==c.id);render();try{await store.saveCards();toast("Tarjeta quitada");}catch(e){toast("No se pudo guardar");}});
        const st=document.createElement("button");st.type="button";st.className="star";st.setAttribute("aria-pressed",!!c.defecto);
        st.textContent=c.defecto?"★ Por defecto":"☆ Por defecto";
        st.addEventListener("click",async()=>{
          const on=!c.defecto;state.cards=state.cards.map(k=>({...k,defecto:on&&k.id===c.id}));
          if(on)aplicarDefecto();render();
          try{await store.saveCards();toast(on?c.nombre+" quedó por defecto":"Sin tarjeta por defecto");}catch(e){toast("No se pudo guardar");}
        });
        const acts=document.createElement("div");acts.className="acts";acts.append(st,x);
        r.append(ch,n,acts);box.appendChild(r);
      });
    }
    const fFecha=new Intl.DateTimeFormat("es-CO",{day:"numeric",month:"short",year:"numeric"});
    function renderDeu(){
      const tipo=state.deuTipo,me=tipo==="meDeben";
      $("#deu-lbl").textContent=me?"Valor que me deben":"Valor que debo";
      $("#in-deu-nota").placeholder=me?"Ej. préstamo a Juan":"Ej. cuota a mi hermano";
      $("#deu-title").textContent=me?"Me deben":"Debo";
      $("#b-deu-save").disabled=!parseMonto($("#in-deu-monto").value)||!$("#in-deu-nota").value.trim();
      const rows=state.deudas.filter(x=>x.tipo===tipo).sort((a,b)=>a.fecha<b.fecha?1:-1);
      const list=$("#deu-list");list.replaceChildren();
      if(!rows.length){const p=document.createElement("p");p.className="empty";p.textContent=me?"Nadie te debe por ahora.":"No tienes deudas registradas.";list.appendChild(p);}
      let total=0;
      rows.forEach(x=>{
        const it=document.createElement("div");it.className="item";
        const sal=saldo(x),hay=(x.abonos||[]).length>0;
        const c=document.createElement("div");c.className="c";c.textContent=x.nota;
        const m=document.createElement("div");m.className="m num";m.textContent=fmt.format(sal);
        const t=document.createElement("div");t.className="t num";t.textContent=fFecha.format(new Date(x.fecha));
        it.append(c,m,t);
        if(hay){const ini=document.createElement("div");ini.className="ini num";ini.textContent="Inicial "+fmt.format(x.monto);it.appendChild(ini);}
        const acts=document.createElement("div");acts.className="acts";
        if(sal===0){const ch=document.createElement("span");ch.className="chip paid";ch.textContent="Pagada";acts.appendChild(ch);}
        if(hay)acts.appendChild(actBtn("Ver historial de abonos","",()=>verHistorial(x)));
        if(sal>0)acts.appendChild(actBtn("Abonar","pay",()=>abonar(x)));
        acts.appendChild(actBtn("Eliminar","del",async()=>{
          if(!await confirmar("¿Desea eliminar esta deuda?"))return;
          state.deudas=state.deudas.filter(k=>k.id!==x.id);lsSave();renderDeu();toast("Deuda eliminada");
        }));
        it.appendChild(acts);list.appendChild(it);total+=sal;
      });
      const tot=$("#deu-total");tot.className="total "+tipo;
      tot.firstElementChild.textContent=(me?"Total que me deben":"Total que debo")+" · "+rows.length+(rows.length===1?" registro":" registros");
      $("#deu-total-v").textContent=fmt.format(total);
    }
    async function abonar(x){
      const sal=saldo(x);
      const box=document.createElement("div");box.className="field";
      const lb=document.createElement("label");lb.htmlFor="in-abono";lb.textContent="Valor a abonar";
      const mw=document.createElement("div");mw.className="money";
      const sp=document.createElement("span");sp.textContent="$";
      const inp=document.createElement("input");inp.id="in-abono";inp.inputMode="numeric";inp.placeholder="0";inp.autocomplete="off";
      inp.addEventListener("input",()=>{const n=parseMonto(inp.value);inp.value=n?n.toLocaleString("es-CO"):"";err.hidden=true;});
      mw.append(sp,inp);
      const err=document.createElement("p");err.className="err";err.hidden=true;
      box.append(lb,mw,err);
      const check=()=>{const n=parseMonto(inp.value);
        if(!n){err.textContent="Escribe el valor a abonar.";err.hidden=false;return false;}
        if(n>sal){err.textContent="El abono no puede ser mayor al saldo ("+fmt.format(sal)+").";err.hidden=false;return false;}
        return true;};
      setTimeout(()=>inp.focus(),50);
      const ok=await modal({title:"Abonar a: "+x.nota,msg:"Saldo actual: "+fmt.format(sal),body:box,
        buttons:[{label:"Cancelar",value:false,ghost:true},{label:"Abonar",value:true,check}]});
      if(!ok)return;
      const n=parseMonto(inp.value);
      state.deudas=state.deudas.map(k=>k.id===x.id?{...k,abonos:[...(k.abonos||[]),{monto:n,fecha:new Date().toISOString()}]}:k);
      lsSave();renderDeu();
      const nuevo=saldo(state.deudas.find(k=>k.id===x.id));
      toast(nuevo===0?"Deuda pagada por completo":"Abono registrado. Saldo: "+fmt.format(nuevo));
    }
    function verHistorial(x){
      const box=document.createElement("div");box.className="stack";box.style.gap="12px";
      const ol=document.createElement("ol");ol.className="hist num";
      const li=(a,b)=>{const l=document.createElement("li");const s1=document.createElement("span");s1.textContent=a;const s2=document.createElement("span");s2.textContent=b;l.append(s1,s2);ol.appendChild(l);};
      li("Deuda inicial "+fFecha.format(new Date(x.fecha)),fmt.format(x.monto));
      [...(x.abonos||[])].sort((a,b)=>a.fecha<b.fecha?-1:1).forEach(a=>li("Abono "+fFecha.format(new Date(a.fecha)),"− "+fmt.format(a.monto)));
      const tot=document.createElement("div");tot.className="hist-total num";
      const t1=document.createElement("span");t1.textContent=saldo(x)===0?"Saldo (pagada)":"Nuevo saldo";
      const t2=document.createElement("span");t2.textContent=fmt.format(saldo(x));tot.append(t1,t2);
      box.append(ol,tot);
      modal({title:"Historial de abonos",msg:x.nota,body:box,buttons:[{label:"Cerrar",value:true}]});
    }
    function render(){renderReg();renderMes();renderCards();renderDeu();}

    /* ---- eventos ---- */
    function tick(){const d=new Date();$("#now").textContent=fFull.format(d);$("#deu-now").textContent=fFecha.format(d);$("#today").textContent=fDate.format(d);}
    tick();setInterval(tick,20000);

    bindSeg("#seg-reg","regTipo",renderReg);
    bindSeg("#seg-mes","mesTipo",()=>{state.mesCard=defDeTipo(state.mesTipo);renderMes();});
    bindSeg("#seg-card","cardTipo");

    $("#in-monto").addEventListener("input",e=>{const n=parseMonto(e.target.value);e.target.value=n?n.toLocaleString("es-CO"):"";renderReg();});
    $("#in-nota").addEventListener("input",renderReg);

    $("#f-gasto").addEventListener("submit",async e=>{
      e.preventDefault();
      const monto=parseMonto($("#in-monto").value),cardId=$("#sel-card").value;
      const nota=$("#in-nota").value.trim();
      if(!monto||!cardId||!nota||!store){if(!nota)$("#in-nota").focus();return;}
      const d=new Date(),card=state.cards.find(c=>c.id===cardId);
      const g={tipo:state.regTipo,cardId,cardNombre:card?card.nombre:"",monto,nota,fecha:d.toISOString(),mes:mkey(d)};
      $("#b-save").disabled=true;
      state.regCard=cardId;try{await store.addGasto(g);$("#in-monto").value="";$("#in-nota").value="";toast("Gasto guardado: "+fmt.format(monto));}
      catch(err){toast(err&&err.code==="quota_exceeded"?"Se llenó el almacenamiento":"No se pudo guardar. Intenta de nuevo.");}
      renderReg();
    });

    $("#f-card").addEventListener("submit",async e=>{
      e.preventDefault();
      const nombre=$("#in-card").value.trim();if(!nombre||!store)return;
      state.cards=[...state.cards,{id:"c"+Date.now().toString(36),nombre,tipo:state.cardTipo}];
      $("#in-card").value="";render();
      try{await store.saveCards();toast("Tarjeta agregada");}catch(err){toast("No se pudo guardar la tarjeta");}
    });

    bindSeg("#seg-deu","deuTipo",renderDeu);
    $("#in-deu-monto").addEventListener("input",e=>{const n=parseMonto(e.target.value);e.target.value=n?n.toLocaleString("es-CO"):"";renderDeu();});
    $("#in-deu-nota").addEventListener("input",renderDeu);
    $("#f-deuda").addEventListener("submit",e=>{
      e.preventDefault();
      const monto=parseMonto($("#in-deu-monto").value),nota=$("#in-deu-nota").value.trim();
      if(!monto||!nota){if(!nota)$("#in-deu-nota").focus();return;}
      state.deudas.push({id:"d"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),tipo:state.deuTipo,monto,nota,fecha:new Date().toISOString()});
      lsSave();$("#in-deu-monto").value="";$("#in-deu-nota").value="";renderDeu();
      toast("Guardado: "+fmt.format(monto));
    });
    $("#b-validar").addEventListener("click",()=>{
      if(state.validando){state.validando=false;state.validados.clear();}else{state.validando=true;}
      renderMes();
    });
    $("#sel-mes-card").addEventListener("change",e=>{state.mesCard=e.target.value;renderMes();});
    $("#m-prev").addEventListener("click",()=>{state.mes=new Date(state.mes.getFullYear(),state.mes.getMonth()-1,1);renderMes();});
    $("#m-next").addEventListener("click",()=>{state.mes=new Date(state.mes.getFullYear(),state.mes.getMonth()+1,1);renderMes();});

    document.querySelector("nav").addEventListener("click",e=>{
      const b=e.target.closest("button");if(!b)return;
      document.querySelectorAll("nav button").forEach(x=>x.removeAttribute("aria-current"));
      b.setAttribute("aria-current","page");
      ["reg","mes","tar","deu"].forEach(v=>$("#v-"+v).hidden=v!==b.dataset.v);
      if(b.dataset.v!=="mes"&&state.validando){state.validando=false;state.validados.clear();}
      if(b.dataset.v==="mes")renderMes();
      window.scrollTo(0,0);
    });

    $("#b-csv").addEventListener("click",exportCSV);
    $("#b-json").addEventListener("click",exportJSON);
    $("#in-import").addEventListener("change",e=>{const f=e.target.files[0];if(f)importJSON(f);e.target.value="";});

    initStore();
    if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
  })();
</script>

</body>
</html>
